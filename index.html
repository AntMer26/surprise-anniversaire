<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Pauline 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Particules d'arrière-plan -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Page de la question -->
    <div class="container" id="questionPage">
        <div class="card question-card">
            <div class="animated-emoji">✨</div>
            <h1 class="title">Pauline... 💕</h1>
            <p class="question">Es-tu disponible pour un date avec le plus beau mec de la planète ?</p>
            
            <div class="buttons-container">
                <button class="btn btn-yes" id="yesBtn" onclick="goToSurprise()">Oui</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="goToSurprise()">Non</button>
            </div>
        </div>
    </div>

    <!-- Page de la surprise -->
    <div class="container hidden" id="surprisePage">
        <div class="card surprise-card">
            <div class="celebration">
                <span class="emoji">🎉</span>
                <span class="emoji">🎊</span>
                <span class="emoji">🎁</span>
            </div>
            
            <h1 class="title">Surprise ! 🎉</h1>
            <p class="subtitle">Tu as bien choisi ! 😉</p>
            
            <div class="details">
                <div class="detail-item">
                    <div class="detail-icon">📅</div>
                    <div class="detail-content">
                        <h3>Quand ?</h3>
                        <p>Samedi 29 août 2026</p>
                    </div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-icon">⏰</div>
                    <div class="detail-content">
                        <h3>À quelle heure ?</h3>
                        <p>18h30</p>
                    </div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-icon">📍</div>
                    <div class="detail-content">
                        <h3>Où ?</h3>
                        <p>Parking de Blériot-Plage</p>
                    </div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-icon">🧳</div>
                    <div class="detail-content">
                        <h3>À prendre</h3>
                        <p>Des vêtements pour dormir</p>
                    </div>
                </div>
            </div>
            
            <div class="love-message">
                <p class="i-love-you">Je t'aime</p>
                <div class="floating-heart-animation">❤️</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
